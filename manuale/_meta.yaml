  - key: dintorni
    n: "05"
    dark: false
    photo: aree/dintorni.jpg    # PROVVISORIA
    title: { it: "I dintorni", en: "Around" }
    mat: { it: "Valtellina · Valmalenco · Valmasino", en: "Valtellina · Valmalenco · Valmasino" }
    lede:
      it: "Da qui si parte per il fiume, per i laghi alpini, per i sentieri dei terrazzamenti. E si mangia molto bene."
      en: "From here you set off for the river, the alpine lakes, the terrace trails. And you eat very well."
    card:
      it: "Dove andare, cosa mangiare, e qualche curiosità del posto."
      en: "Where to go, what to eat, and a few local curiosities."
    tags: { it: [gite, cibo, "sentieri"], en: [trips, food, trails] }
    sections:
      - { slug: "60-cosa-fare",       mat: { it: "A piedi · in bici · in auto", en: "On foot · by bike · by car" } }
